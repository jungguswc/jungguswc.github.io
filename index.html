const C = {

  ok: "#2E7D5B", warn: "#B8860B", bad: "#B4472F",
};

function Pill({ children, color }) {
  return <span className="inline-block px-2 py-0.5 rounded-full text-xs font-semibold" style={{ background: `${color}1A`, color }}>{children}</span>;
}
function Card({ title, children, right }) {
  return (
    <div className="rounded-xl p-5 mb-5" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
      {title ? <div className="flex items-center justify-between mb-3">
        <h3 className="font-bold text-base" style={{ color: C.ink }}>{title}</h3>{right}
      </div> : null}
      {children}
    </div>
  );
}
function Field({ label, children, required }) {
  return (
    <div className="mb-4">
      <label className="block text-sm font-semibold mb-1.5" style={{ color: C.ink }}>{label}{required ? <span style={{ color: C.bad }}> *</span> : null}</label>
      {children}
    </div>
  );
}
function TA(props) {
  return <textarea rows={props.rows || 2} value={props.value || ""} placeholder={props.placeholder}
    onChange={(e) => props.onChange(e.target.value)} className="w-full rounded-md px-3 py-2 text-sm"
    style={{ border: `1px solid ${C.line}`, resize: "vertical" }} />;
}
function IN(props) {
  return <input type={props.type || "text"} value={props.value ?? ""} placeholder={props.placeholder}
    onChange={(e) => props.onChange(e.target.value)} className="rounded-md px-2.5 py-1.5 text-sm w-full"
    style={{ border: `1px solid ${C.line}` }} />;
}
function gradeColor(g) {
  if (g === "우수") return C.ok;
  if (g === "양호") return "#4C8C6B";
  if (g === "보통") return C.warn;
  return C.bad;
}
function gradeColor5(g) {
  if (g === "매우충실") return C.ok;
  if (g === "충실") return "#4C8C6B";
  if (g === "보통") return C.warn;
  if (g === "미흡") return "#C9823D";
  if (g === "매우미흡") return C.bad;
  return C.muted;
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(String(r.result).split(",")[1]);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

/* ── 파일 첨부 위젯 (한글/PDF/이미지) ───────────────────────── */
function FileAttach({ files, setFiles }) {
  const onPick = async (e) => {
    const picked = Array.from(e.target.files || []);
    const converted = [];
    for (const f of picked) {
      if (f.size > 8 * 1024 * 1024) { alert(`"${f.name}" 파일이 8MB를 초과합니다. 더 작은 파일로 첨부해 주세요.`); continue; }
      const base64 = await fileToBase64(f);
      converted.push({ name: f.name, mimeType: f.type || "application/octet-stream", base64 });
    }
    setFiles([...files, ...converted]);
  };
  return (
    <div>
      <input type="file" multiple accept=".hwp,.hwpx,.pdf,image/*" onChange={onPick}
        className="text-sm" />
      <p className="text-xs mt-1" style={{ color: C.muted }}>한글(HWP/HWPX)·PDF·이미지 파일 첨부 가능 (파일당 8MB 이하)</p>
      {files.length > 0 && (
        <ul className="mt-2 space-y-1">
          {files.map((f, i) => (
            <li key={i} className="flex items-center justify-between text-sm rounded px-2 py-1" style={{ background: C.navySoft }}>
              <span>📎 {f.name}</span>
              <button onClick={() => setFiles(files.filter((_, j) => j !== i))} className="text-xs font-bold" style={{ color: C.bad }}>삭제</button>
            </li>
          ))}
        </ul>
      )}
    </div>
  );
}

/* ── 4점 리커트(①~④) 점검표 블록 (그룹별 문항 + 비고) ────────── */
function LikertBlock({ groups, values, setValue, note, setNote, noteLabel }) {
  return (
    <div>
      <div className="overflow-x-auto">
        <table className="w-full text-sm" style={{ borderCollapse: "collapse" }}>
          <thead>
            <tr style={{ background: C.navy, color: "#fff" }}>
              <th className="px-2 py-2 text-left" style={{ width: "92px" }}>구분</th>
              <th className="px-2 py-2 text-left">문항 내용</th>
              {LIKERT_LABELS.map((l) => (
                <th key={l} className="px-1 py-2 text-center" style={{ width: "36px" }} title={l}>{l.slice(0, 1)}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {groups.map((g) => g.items.map((it, idx) => (
              <tr key={it.key} style={{ borderBottom: `1px solid ${C.line}` }}>
                {idx === 0 && (
                  <td rowSpan={g.items.length} className="px-2 py-2 font-semibold align-top text-xs" style={{ background: C.navySoft, color: C.navy }}>{g.group}</td>
                )}
                <td className="px-2 py-2">{it.label}</td>
                {[1, 2, 3, 4, 5].map((n) => (
                  <td key={n} className="px-1 py-2 text-center">
                    <input type="radio" name={it.key} checked={values[it.key] === n} onChange={() => setValue(it.key, n)} />
                  </td>

              </tr>
            )))}
          </tbody>
        </table>
      </div>
      <div className="mt-3">
        <Field label={noteLabel || "비고 (변경계획 등 간단히 기술)"}>
          <TA value={note} onChange={setNote} rows={2} />
        </Field>
      </div>
    </div>
  );
}

function GonggongInput({ flash }) {
  const [code, setCode] = useState("");

    typeJungjeom: "", typeMingwan: "", typeGyunhyung: "", // "유" | "무"

    check1: {}, check1Note: "",
    progressPlan: "",
    check2: {}, check2Note: "",
    nextPlanNote: "", suggestion: "",

  const [form, setForm] = useState(blankForm());
  const [files, setFiles] = useState([]);
  const [submitting, setSubmitting] = useState(false);

  const project = PROJECTS.find((p) => p.사업번호 === code);
  const set = (k, v) => setForm((f) => ({ ...f, [k]: v }));

  const setCheck2 = (k, v) => setForm((f) => ({ ...f, check2: { ...f.check2, [k]: v } }));

      <label><input type="radio" checked={value === "무"} onChange={() => onChange("무")} /> 무</label>
    </div>
  );

  const submit = async () => {
    if (!code) { alert("사업을 먼저 선택해 주세요."); return; }
    if (!form.officerName) { alert("담당자명을 입력해 주세요."); return; }
    if (!form.scale1 || !form.scale2 || !form.scale3) { alert("1~3번의 이행현황/이행정도/절차준수 정도를 모두 선택해 주세요."); return; }
    setSubmitting(true);
    try {
      const payload = {
        projectCode: code, projectName: project ? project.사업명 : "", dept: project ? project.담당부서 : "",
        ...form, rate, files
      };
      // Apps Script 웹앱은 POST 응답의 CORS 헤더를 브라우저가 못 읽는 경우가 있어
      // no-cors 모드로 전송합니다 (요청 자체는 정상 처리되지만, 응답 내용은 읽을 수 없습니다).
      await fetch(API_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      });
      flash(`제출 요청을 보냈습니다. 잠시 후 워크북에서 반영 여부를 확인해 주세요.`);
      setForm(blankForm());
      setFiles([]);
    } catch (err) {
      alert("전송 오류: " + err.message + " (API_URL 설정을 확인해 주세요)");
    } finally {
      setSubmitting(false);
    }

                <option key={p.사업번호} value={p.사업번호}>{p.사업번호} · {p.사업명}</option>

            </optgroup>
          ))}
        </select>
        {project && <p className="text-xs mt-2" style={{ color: C.muted }}>담당부서: {project.담당부서} · 유형: {project.유형명}</p>}
      </Card>

      {code && (
        <div>
          <Card title="사업담당 / 사업유형 구분">
            <div className="grid grid-cols-2 gap-3">
              <Field label="담당자명" required><IN value={form.officerName} onChange={(v) => set("officerName", v)} /></Field>
              <Field label="연락처"><IN value={form.officerPhone} onChange={(v) => set("officerPhone", v)} placeholder="000-0000" /></Field>
            </div>
            <div className="grid grid-cols-3 gap-3">
              <Field label="중점추진사업"><YesNo value={form.typeJungjeom} onChange={(v) => set("typeJungjeom", v)} /></Field>
              <Field label="민관협력사업"><YesNo value={form.typeMingwan} onChange={(v) => set("typeMingwan", v)} /></Field>
              <Field label="균형발전사업"><YesNo value={form.typeGyunhyung} onChange={(v) => set("typeGyunhyung", v)} /></Field>
            </div>
          </Card>

          <Card title="1. 사업비 이행 현황" right={<Pill color={C.navy}>5단계 척도</Pill>}>
            <Scale5Picker value={form.scale1} onChange={(v) => set("scale1", v)} />
            <div className="grid grid-cols-3 gap-3 mt-4">
              <Field label="2026년도 예산(백만원)"><IN type="number" value={form.budgetPlan} onChange={(v) => set("budgetPlan", v)} /></Field>
              <Field label="예산 집행액(백만원)"><IN type="number" value={form.budgetSpent} onChange={(v) => set("budgetSpent", v)} /></Field>
              <Field label="집행률(자동계산)"><div className="rounded-md px-3 py-2 text-sm font-bold" style={{ background: C.navySoft, color: C.navy }}>{rate !== null ? `${rate}%` : "-"}</div></Field>

          ) : (
            <div className="text-sm space-y-3">
              <div><b>담당자:</b> {perf.담당자명} ({perf.연락처})</div>
              <div><b>사업유형:</b> 중점추진 {perf.중점추진사업 || "-"} · 민관협력 {perf.민관협력사업 || "-"} · 균형발전 {perf.균형발전사업 || "-"}</div>
              <div><b>사업비:</b> 계획 {perf["2026년도_예산(백만원)"]}백만원 / 집행 {perf["예산_집행액(백만원)"]}백만원 (집행률 {perf["집행률(%)"]}%)</div>
              <div><b>1. 사업비 이행현황:</b> <Pill color={gradeColor5(perf.사업비_이행현황_구분)}>{perf.사업비_이행현황_구분 || "-"}</Pill> {perf.변경_필요여부 === "변경" ? `(변경 — ${perf.변경내용 || ""})` : ""}</div>
              <div><b>2. 성과목표 이행정도:</b> <Pill color={gradeColor5(perf.성과목표_이행정도_구분)}>{perf.성과목표_이행정도_구분 || "-"}</Pill></div>
              {perf.담당자_의견 && <div className="pl-3" style={{ color: C.muted }}>└ 담당자 의견: {perf.담당자_의견}</div>}
              <div><b>3. 변경내용 및 절차준수 정도:</b> <Pill color={gradeColor5(perf.변경내용및절차준수_구분)}>{perf.변경내용및절차준수_구분 || "-"}</Pill></div>
              <div><b>상반기 추진현황 및 향후계획:</b><div className="whitespace-pre-wrap mt-1" style={{ color: C.muted }}>{perf.상반기_추진현황및향후계획}</div></div>
              {perf.기타점검_비고 && <div><b>기타 점검 비고:</b> {perf.기타점검_비고}</div>}
              {perf.차기계획_수정반영할점 && <div><b>차기계획 수정반영할 점:</b> {perf.차기계획_수정반영할점}</div>}
              {perf.건의사항_기타의견 && <div><b>건의사항/기타의견:</b> {perf.건의사항_기타의견}</div>}
              {perf.첨부파일_링크 && (
                <div><b>첨부자료:</b> {perf.첨부파일_링크.split(",").map((u, i) => (
                  <a key={i} href={u.trim()} target="_blank" rel="noreferrer" className="underline mr-2" style={{ color: C.navy }}>파일{i + 1}</a>
                ))}</div>
              )}
            </div>
          )}
          <a href={MONITOR_FORM_URL} target="_blank" rel="noreferrer">
            <button className="w-full py-3 rounded-lg font-bold text-white mt-4" style={{ background: C.navy }}>
              이 자료를 참고하여 구글폼으로 평가하러 가기 →
            </button>
          </a>
        </Card>
      )}
    </div>
  );
}

/* ── 관리자 : 종합대시보드 ──────────────────────────────────── */
function AdminDashboard({ data }) {
  const submittedCodes = new Set(data.performance.map((p) => p.사업번호));
  const submitCount = PROJECTS.filter((p) => submittedCodes.has(p.사업번호)).length;
  const scoreByCode = {};
  data.scores.forEach((s) => { scoreByCode[s.사업번호] = s; });

  const gradeCount = { 우수: 0, 양호: 0, 보통: 0, 개선필요: 0 };
  data.scores.forEach((s) => { if (gradeCount[s.등급] !== undefined) gradeCount[s.등급]++; });
  const overallAvg = data.scores.length ? (data.scores.reduce((a, s) => a + Number(s.종합점수 || 0), 0) / data.scores.length).toFixed(1) : "-";

  return (
    <div>
      <div className="grid grid-cols-4 gap-4 mb-5">
        {[["세부사업", `${PROJECTS.length}개`], ["공공 실적 제출", `${submitCount}/${PROJECTS.length}`],
          ["위원 평가 완료", `${data.scores.length}/${PROJECTS.length}`], ["전체 평균 종합점수", overallAvg]].map(([l, v]) => (
          <div key={l} className="rounded-xl p-4 text-center" style={{ background: C.navySoft }}>
            <div className="text-2xl font-extrabold" style={{ color: C.navy }}>{v}</div>
            <div className="text-xs mt-1" style={{ color: C.muted }}>{l}</div>
          </div>
        ))}
      </div>
      <Card title="등급 분포">
        <div className="grid grid-cols-4 gap-3">
          {Object.entries(gradeCount).map(([g, n]) => (
            <div key={g} className="rounded-lg p-3 text-center" style={{ background: `${gradeColor(g)}15` }}>
              <div className="text-xl font-bold" style={{ color: gradeColor(g) }}>{n}</div>
              <div className="text-xs" style={{ color: C.muted }}>{g}</div>
            </div>
          ))}
        </div>
      </Card>
      <Card title="분과별 요약">
        <table className="w-full text-sm">
          <thead><tr style={{ background: C.navy, color: "#fff" }}>
            {["분과", "사업수", "실적제출", "평가완료", "평균점수"].map((h) => <th key={h} className="px-2 py-2 text-left">{h}</th>)}
          </tr></thead>
          <tbody>
            {BUNGA_ORDER.map((b) => {
              const items = PROJECTS.filter((p) => p.분과 === b);
              const sub = items.filter((p) => submittedCodes.has(p.사업번호)).length;
              const evald = items.filter((p) => scoreByCode[p.사업번호]).length;
              const scores = items.map((p) => scoreByCode[p.사업번호]).filter(Boolean);
              const avg = scores.length ? (scores.reduce((a, s) => a + Number(s.종합점수 || 0), 0) / scores.length).toFixed(1) : "-";
              return (
                <tr key={b} style={{ borderBottom: `1px solid ${C.line}` }}>
                  <td className="px-2 py-2">{b}</td><td className="px-2 py-2">{items.length}</td>
                  <td className="px-2 py-2">{sub}/{items.length}</td><td className="px-2 py-2">{evald}/{items.length}</td>
                  <td className="px-2 py-2 font-bold">{avg}</td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </Card>
    </div>
  );
}

/* ── 관리자 : 사업별 현황 ───────────────────────────────────── */
function AdminProjectList({ data }) {
  const submittedCodes = new Set(data.performance.map((p) => p.사업번호));
  const scoreByCode = {};
  data.scores.forEach((s) => { scoreByCode[s.사업번호] = s; });
  return (
    <Card title="사업별 현황 (전체 45개)">
      <table className="w-full text-sm">
        <thead><tr style={{ background: C.navy, color: "#fff" }}>
          {["분과", "사업번호", "사업명", "공공제출", "종합점수", "등급"].map((h) => <th key={h} className="px-2 py-2 text-left">{h}</th>)}
        </tr></thead>
        <tbody>
          {PROJECTS.map((p) => {
            const s = scoreByCode[p.사업번호];
            return (
              <tr key={p.사업번호} style={{ borderBottom: `1px solid ${C.line}` }}>
                <td className="px-2 py-1.5">{p.분과}</td><td className="px-2 py-1.5">{p.사업번호}</td>
                <td className="px-2 py-1.5">{p.사업명}</td>
                <td className="px-2 py-1.5">{submittedCodes.has(p.사업번호) ? <Pill color={C.ok}>제출완료</Pill> : <Pill color={C.bad}>미제출</Pill>}</td>
                <td className="px-2 py-1.5">{s ? s.종합점수 : "-"}</td>
                <td className="px-2 py-1.5">{s ? <Pill color={gradeColor(s.등급)}>{s.등급}</Pill> : "-"}</td>
              </tr>
            );
          })}
        </tbody>
      </table>
    </Card>
  );
}

/* ── 관리자 : 결과보고서 자동생성 (인쇄/PDF) ────────────────── */
function esc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

function buildReportHtml(data) {
  const scoreByCode = {}; data.scores.forEach((s) => { scoreByCode[s.사업번호] = s; });
  const overallAvg = data.scores.length ? (data.scores.reduce((a, s) => a + Number(s.종합점수 || 0), 0) / data.scores.length).toFixed(1) : "-";
  const rows = PROJECTS.map((p) => {
    const s = scoreByCode[p.사업번호] || {};
    return `<tr><td>${esc(p.분과)}</td><td>${esc(p.사업번호)}</td><td>${esc(p.사업명)}</td><td>${esc(s.종합점수 || "-")}</td><td>${esc(s.등급 || "-")}</td></tr>`;
  }).join("");
  return `
    <h1>2026년 연차별 시행계획 모니터링 결과보고서</h1>
    <p>대구광역시 중구 · 생성일 ${new Date().toLocaleDateString("ko-KR")}</p>
    <h2>종합 결과</h2>
    <p>세부사업 ${PROJECTS.length}개 / 전체 평균 종합점수 ${overallAvg}점</p>
    <h2>사업별 상세 결과</h2>
    <table border="1" cellspacing="0" cellpadding="6" style="width:100%;border-collapse:collapse">
      <tr style="background:#1E2761;color:#fff"><th>분과</th><th>사업번호</th><th>사업명</th><th>종합점수</th><th>등급</th></tr>
      ${rows}
    </table>`;
}

function printReport(data) {
  const w = window.open("", "_blank");
  const html = buildReportHtml(data);
  w.document.write(`<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><title>모니터링 결과보고서</title>
  <style>body{font-family:'Malgun Gothic',sans-serif;padding:30px;color:#1C201D}h1{font-size:22px}h2{font-size:16px;margin-top:24px}
  table{font-size:13px}th,td{border:1px solid #ccc;padding:6px}</style></head><body>${html}
  <div style="margin:24px 0;text-align:center"><button onclick="window.print()" style="padding:10px 22px;font-weight:700;background:#1E2761;color:#fff;border:none;border-radius:8px">🖨 인쇄 / PDF로 저장</button></div>
  <script>window.onload=function(){setTimeout(function(){window.print();},500);};<\/script></body></html>`);
  w.document.close();
}

/* ── 최상위 App ─────────────────────────────────────────────── */
function App() {
  const [role, setRole] = useState("gonggong");
  const [tab, setTab] = useState("input");
  const [data, setData] = useState({ performance: [], scores: [], bungaSummary: [] });
  const [loading, setLoading] = useState(true);
  const [toast, setToast] = useState("");

  const flash = (m) => { setToast(m); setTimeout(() => setToast(""), 2500); };

  const load = useCallback(async () => {
    setLoading(true);
    try {
      const res = await fetch(API_URL);
      const json = await res.json();
      if (json.status === "ok") setData({ performance: json.performance || [], scores: json.scores || [], bungaSummary: json.bungaSummary || [] });
    } catch (e) { /* API_URL 미설정 시 무시 */ }
    setLoading(false);
  }, []);

  useEffect(() => { load(); }, [load]);

  const tabsByRole = {
    admin: [["dashboard", "종합대시보드"], ["projects", "사업별현황"], ["report", "결과보고서"]],
    gonggong: [["input", "실적입력"]],
    monitor: [["view", "자료열람"]],
    expert: [["view", "자료열람"]],
  };

  useEffect(() => { setTab(tabsByRole[role][0][0]); }, [role]);

  return (
    <div style={{ background: C.paper, minHeight: "100vh", fontFamily: "'Pretendard','Malgun Gothic',sans-serif" }}>
      <div style={{ background: C.navy }} className="px-6 py-5 text-white">
        <div className="text-xs opacity-80">대구광역시 중구지역사회보장협의체</div>
        <div className="text-xl font-extrabold">2026년 연차별 시행계획 온라인 모니터링 시스템</div>
        <div className="mt-3">
          <select value={role} onChange={(e) => setRole(e.target.value)} className="rounded-md px-3 py-1.5 text-sm text-black">
            {ROLES.map((r) => <option key={r.id} value={r.id}>{r.label}</option>)}
          </select>
        </div>
      </div>

      <div className="px-6 pt-4 flex gap-2 flex-wrap">
        {tabsByRole[role].map(([id, label]) => (
          <button key={id} onClick={() => setTab(id)} className="px-4 py-2 rounded-t-lg text-sm font-semibold"
            style={{ background: tab === id ? C.surface : "transparent", color: tab === id ? C.navy : C.muted, border: tab === id ? `1px solid ${C.line}` : "none", borderBottom: tab === id ? "none" : undefined }}>
            {label}
          </button>
        ))}
        <button onClick={load} className="ml-auto text-xs px-3 py-1.5 rounded-md" style={{ border: `1px solid ${C.line}`, color: C.muted }}>🔄 새로고침</button>
      </div>

      <div className="p-6">
        {loading ? <p style={{ color: C.muted }}>불러오는 중…</p> : (
          <>
            {tab === "input" && <GonggongInput flash={flash} />}
            {tab === "view" && <MonitorView data={data} />}
            {tab === "dashboard" && <AdminDashboard data={data} />}
            {tab === "projects" && <AdminProjectList data={data} />}
            {tab === "report" && (
              <Card title="결과보고서 자동 생성">
                <p className="text-sm mb-3" style={{ color: C.muted }}>현재 집계된 데이터를 기준으로 인쇄용 보고서를 새 창으로 엽니다. 인쇄 대화상자에서 "PDF로 저장"을 선택하면 PDF 파일로 저장됩니다.</p>
                <button onClick={() => printReport(data)} className="px-5 py-3 rounded-lg font-bold text-white" style={{ background: C.navy }}>🖨 결과보고서 인쇄 / PDF 저장</button>
              </Card>
            )}
          </>
        )}
      </div>

      {toast && <div className="fixed bottom-6 right-6 px-4 py-3 rounded-lg text-white font-semibold" style={{ background: C.navy }}>{toast}</div>}
    </div>
  );
}

const rootEl = document.getElementById("root");
ReactDOM.createRoot(rootEl).render(<App />);
</script>
</body></html>
